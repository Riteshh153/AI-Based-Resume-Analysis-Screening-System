# ====================================================================
# HireSmart ATS - Application Configuration
# ====================================================================

spring.application.name=HireSmart-ATS
server.port=${SERVER_PORT:8085}

# Primary MySQL Database Configuration (overridable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hiresmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# File Upload configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
hiresmart.storage.upload-dir=uploads/resumes

# JavaMail / SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noreply@hiresmart.local}
spring.mail.password=${SMTP_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# AI Provider Configuration (Optional - falls back to baseline algorithm if empty)
hiresmart.ai.provider=${AI_PROVIDER:baseline}
hiresmart.ai.api-key=${AI_API_KEY:}
hiresmart.ai.model=${AI_MODEL:gemini-1.5-flash}

# Single Fixed Administrator Configuration (Overridable via Environment Variables)
app.admin.email=${ADMIN_EMAIL:admin@hiresmart.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Logging
logging.level.com.hiresmart=INFO
logging.level.org.springframework.jdbc=INFO
